; Production firmware configuration.
; Experimental firmware environments live in experiments/platformio.ini.

[platformio]
data_dir = data

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.sdkconfig = sdkconfig.defaults
board_build.filesystem = spiffs
extra_scripts = pre:tools/pio_framework_library_includes.py

monitor_speed = 115200
upload_port = COM15
monitor_port = COM15
monitor_encoding = utf-8
lib_ldf_mode = deep+

build_flags =
	-DAPP_NAME=\"CAN-Grabber\"
	-DAPP_VERSION=\"0.0.1\"
	-DPIO_ENV_NAME=\"${PIOENV}\"
	-DENABLE_COMPRESSOR=0
	-DCONFIG_VFS_MAX_OPEN_FILES=12
	-DCONFIG_FATFS_MAX_OPEN_FILES=12

lib_deps =
	handmade0octopus/ESP32-TWAI-CAN@^1.0.1
	https://github.com/Modellfan/ACAN2515
	arkhipenko/TaskScheduler@^3.8.5
	bblanchon/ArduinoJson@^7.0.4
	adafruit/RTClib@^2.1.4
	SD
	WiFi
	ESPmDNS
	ArduinoOTA
	https://github.com/ESP32Async/AsyncTCP.git

[env:esp32s3_debug]
extends = env:esp32s3
build_type = debug

[env:esp32s3_release]
extends = env:esp32s3
build_type = release
