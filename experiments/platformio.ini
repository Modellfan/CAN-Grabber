; Hardware experiment configuration.
; Run from the repository root with:
;   pio run -d experiments -e <environment>

[platformio]
src_dir = ..
include_dir = ../include
data_dir = ../data
build_dir = ../.pio/experiments
libdeps_dir = ../.pio/experiment-libdeps

[experiment_base]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.sdkconfig = ../sdkconfig.defaults
board_build.filesystem = spiffs
extra_scripts = pre:../tools/pio_framework_library_includes.py
monitor_speed = 115200
upload_port = COM15
monitor_port = COM15
monitor_encoding = utf-8
lib_ldf_mode = deep+
build_type = debug

build_flags =
	-DAPP_NAME=\"CAN-Grabber-Experiment\"
	-DAPP_VERSION=\"0.0.1\"
	-DPIO_ENV_NAME=\"${PIOENV}\"
	-DENABLE_COMPRESSOR=0
	-DCONFIG_VFS_MAX_OPEN_FILES=12
	-DCONFIG_FATFS_MAX_OPEN_FILES=12
	-I../src

lib_deps =
	handmade0octopus/ESP32-TWAI-CAN@^1.0.1
	https://github.com/Modellfan/ACAN2515
	arkhipenko/TaskScheduler@^3.8.5
	bblanchon/ArduinoJson@^7.0.4
	adafruit/RTClib@^2.1.4
	SD
	WiFi
	ESPmDNS
	ArduinoOTA
	https://github.com/ESP32Async/AsyncTCP.git

[env:sd_speed_test]
extends = experiment_base
build_src_filter = -<*> +<experiments/storage-performance/code/sd_speed_test.cpp>
build_flags = ${experiment_base.build_flags} -DSD_SPEED_TEST

[env:sd_sdio_speed_test]
extends = experiment_base
build_src_filter = -<*> +<experiments/storage-performance/code/sd_sdio_speed_test.cpp>
build_flags = ${experiment_base.build_flags} -DSD_SDIO_SPEED_TEST

[env:rx_load_test]
extends = experiment_base
build_src_filter =
	-<*>
	+<src/config/app_config.cpp>
	+<src/storage/storage_manager.cpp>
	+<src/logging/log_writer.cpp>
	+<experiments/can-pipeline/code/rx_load_test.cpp>
	+<experiments/can-pipeline/code/can_manager_load_test.cpp>
	+<experiments/can-pipeline/code/upload_stub.cpp>
build_flags = ${experiment_base.build_flags} -Ican-pipeline/code -DRX_LOAD_TEST

[env:can_to_file_modules]
extends = experiment_base
build_src_filter =
	-<*>
	+<src/*>
	-<src/main.cpp>
	-<src/compress/compressor.cpp>
	+<experiments/can-pipeline/code/can_to_file_modules.cpp>
	+<experiments/can-pipeline/code/compressor_stub.cpp>
build_flags = ${experiment_base.build_flags} -DCAN_TO_FILE_MODULES

[env:sta_ap_test]
extends = experiment_base
build_src_filter = -<*> +<experiments/network-http/code/sta_ap_test.cpp>
build_flags = ${experiment_base.build_flags} -DSTA_AP_TEST

